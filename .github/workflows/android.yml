name: android

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android.yml"
      - "clients/android"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android test APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APP_PACKAGE: icu.ocyss.chatcraft
    steps:
      - uses: actions/checkout@v4

      - name: Validate Telegram API configuration
        env:
          CHATCRAFT_API_ID: ${{ secrets.CHATCRAFT_API_ID }}
          CHATCRAFT_API_HASH: ${{ secrets.CHATCRAFT_API_HASH }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          api_id = os.environ.get('CHATCRAFT_API_ID', '')
          api_hash = os.environ.get('CHATCRAFT_API_HASH', '')
          if not re.fullmatch(r'[1-9][0-9]*', api_id) or int(api_id) > 2147483647 or not re.fullmatch(r'[0-9a-fA-F]{32}', api_hash):
              sys.exit('Configure CHATCRAFT_API_ID (positive int32) and CHATCRAFT_API_HASH (32 hex characters) repository secrets.')
          PY

      - name: Validate Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          value = os.environ.get('GOOGLE_SERVICES_JSON', '')
          if not value:
              sys.exit('Configure ANDROID_GOOGLE_SERVICES_JSON with Firebase configuration for icu.ocyss.chatcraft before building.')
          config = json.loads(value)
          packages = [client.get('client_info', {}).get('android_client_info', {}).get('package_name') for client in config.get('client', [])]
          if os.environ['APP_PACKAGE'] not in packages:
              sys.exit('ANDROID_GOOGLE_SERVICES_JSON does not contain the required application ID.')
          PY

      - name: Initialize fixed Android submodule
        run: |
          git submodule update --init clients/android
          git -C clients/android submodule update --init --recursive --jobs 4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm ninja-build
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'

      - uses: gradle/actions/setup-gradle@v4

      - name: Provide variant Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path('clients/android/TMessagesProj_App/src/afatRelease/google-services.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(os.environ['GOOGLE_SERVICES_JSON'], encoding='utf-8')
          PY

      # The upstream keystore is public: this artifact is for testing, not distribution.
      # Android has not yet integrated the Chatcraft Rust settings used by Desktop.
      - name: Build test-signed APK
        env:
          CHATCRAFT_API_ID: ${{ secrets.CHATCRAFT_API_ID }}
          CHATCRAFT_API_HASH: ${{ secrets.CHATCRAFT_API_HASH }}
        working-directory: clients/android
        run: >-
          bash ./gradlew :TMessagesProj_App:assembleAfatRelease
          -PAPP_PACKAGE=icu.ocyss.chatcraft
          --no-daemon --max-workers=2 --stacktrace
          -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g'

      - name: Verify APK identity and signature
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          apk = Path('clients/android/TMessagesProj_App/build/outputs/apk/afat/release/app.apk')
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0'
          result = subprocess.check_output([str(tools / 'aapt'), 'dump', 'badging', str(apk)], text=True)
          if "package: name='icu.ocyss.chatcraft'" not in result:
              raise SystemExit('Unexpected APK application ID')
          subprocess.run([str(tools / 'apksigner'), 'verify', '--verbose', str(apk)], check=True)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: chatcraft-android-test-${{ github.sha }}
          path: clients/android/TMessagesProj_App/build/outputs/apk/afat/release/app.apk
          if-no-files-found: error
          retention-days: 14
