# 桌面端 Windows 完整构建：Rust FFI + Telegram Desktop (fork 子模块)
# 裁剪自 clients/desktop/.github/workflows/win.yml，单配置 x64 / Debug。
name: desktop-win

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    steps:
      - name: Clone.
        uses: actions/checkout@v4

      - name: Validate Chatcraft API configuration.
        shell: pwsh
        env:
          CHATCRAFT_API_ID: ${{ secrets.CHATCRAFT_API_ID }}
          CHATCRAFT_API_HASH: ${{ secrets.CHATCRAFT_API_HASH }}
        run: |
          if ($env:CHATCRAFT_API_ID -notmatch '^[1-9][0-9]*$' -or
              $env:CHATCRAFT_API_HASH -notmatch '^[0-9a-fA-F]{32}$') {
            throw 'Configure CHATCRAFT_API_ID and CHATCRAFT_API_HASH repository secrets. Fork PRs without secrets cannot build Desktop.'
          }

      - name: Init desktop submodule.
        # 只拉 desktop：android/ios 暂不需要，且 ios 的嵌套子模块源仓库已失效
        shell: bash
        run: |
          git submodule update --init clients/desktop
          git -C clients/desktop submodule update --init --recursive

      - name: Apply and verify Desktop UI integration.
        # 子模块提交不包含本地未提交改动；从主仓库应用受版本控制的 UI overlay。
        run: python scripts/prepare-desktop.py

      - name: Prepare directories.
        # 复刻官方布局：TBuild\Libraries 与客户端仓库互为兄弟目录
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          mklink /d %userprofile%\TBuild\desktop %GITHUB_WORKSPACE%\clients\desktop
          rem prepare 脚本按仓库真实路径解析 ../Libraries，会写到 clients\Libraries
          rem 用符号链接引回 TBuild\Libraries，与缓存路径保持一致
          mklink /d %GITHUB_WORKSPACE%\clients\Libraries %userprofile%\TBuild\Libraries
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/desktop/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/desktop/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/**', 'scripts/build-desktop-rust.py', '.github/workflows/desktop-win.yml') }}" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "ci@chatcraft.local"
          git config --global user.name "chatcraft-ci"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache restore.
        # prepare.py 以脚本位置上溯四级为 rootDir（本仓库即 clients/），
        # ThirdParty 实际位于 clients/ThirdParty
        id: cache-third-party
        uses: actions/cache/restore@v4
        with:
          path: clients/ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache restore.
        id: cache-libs
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache restore.
        id: cache-qt
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Libraries.
        run: |
          %TBUILD%\desktop\Telegram\build\prepare\win.bat skip-release silent

      - name: Build unified Rust static library.
        # 沿用 prepare 的工具链、Win7 target、build-std 和静态 CRT。
        # 即使恢复了旧前缀缓存也必须重建，不能复用未包含 ChatCraft 的库。
        run: python scripts/build-desktop-rust.py --libraries "%LibrariesPath%"

      # 立即保存缓存（即使后续步骤失败），避免重跑时重建 Qt 等耗时依赖
      - name: ThirdParty cache save.
        if: always() && steps.cache-third-party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: clients/ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}

      - name: Libraries cache save.
        if: always() && steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}

      - name: Qt cache save.
        if: always() && steps.cache-qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}

      - name: Verify dependencies.
        # 依赖完整性检查：失败时直接列出目录，便于定位是未构建还是路径不一致
        shell: bash
        run: |
          echo "LibrariesPath=$LibrariesPath"
          ls "$LibrariesPath" || true
          echo "--- Qt dirs ---"
          ls -d "$LibrariesPath"/[qQ]t* 2>/dev/null || true
          if ! ls -d "$LibrariesPath"/Qt-* > /dev/null 2>&1; then
            echo "::error::Qt install dir (Qt-*) not found under $LibrariesPath"
            exit 1
          fi

      - name: Free up some disk space.
        shell: bash
        # 保留 tdesktop_rust：清理白名单不含 .cpp，会误删 wallet_engine 生成代码
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' -o -path '*/tdesktop_rust/*' ')' -type f ')' -o -empty ')' -delete

      - name: Verify Desktop UI integration before compiling.
        run: python scripts/prepare-desktop.py --check

      - name: Telegram Desktop build.
        # Pass secrets as environment data, never interpolate them into shell source.
        env:
          CHATCRAFT_API_ID: ${{ secrets.CHATCRAFT_API_ID }}
          CHATCRAFT_API_HASH: ${{ secrets.CHATCRAFT_API_HASH }}
        run: |
          cd %TBUILD%\desktop\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_TEST=OFF ^
          -D CHATCRAFT_MAX_ACCOUNTS=6 ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF
          if errorlevel 1 exit /b 1

          cmake --build ..\out --config Debug --parallel

      - name: Move artifact.
        run: |
          set OUT=%TBUILD%\desktop\out\Debug
          mkdir artifact
          mkdir artifact\scripts
          copy examples\lua\welcome.lua artifact\scripts\welcome.lua
          copy README.md artifact\scripts\README.md
          copy README.md artifact\README.md
          mkdir artifact\scripts\types
          copy docs\lua\chatcraft.lua artifact\scripts\types\chatcraft.lua
          echo {"runtime":{"version":"Lua 5.4"},"workspace":{"library":["types"],"checkThirdParty":false}}>artifact\scripts\.luarc.json
          mkdir artifact\examples
          copy examples\lua\chat_list.lua artifact\examples\chat_list.lua
          copy examples\lua\ad_filter.lua artifact\examples\ad_filter.lua
          copy examples\lua\ui_filter.lua artifact\examples\ui_filter.lua
          echo Source commit: %GITHUB_SHA%>artifact\BUILD-INFO.txt
          echo Desktop UI: script manager, folder opener, stable ID filtering>>artifact\BUILD-INFO.txt
          move %OUT%\Telegram.exe artifact/
          rem Official auto-update is disabled; do not distribute Updater.exe.

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: Telegram-Windows-x64
          path: artifact\
          retention-days: 3
