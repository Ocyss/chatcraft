# 桌面端 Windows 完整构建：Rust FFI + Telegram Desktop (fork 子模块)
# 裁剪自 clients/desktop/.github/workflows/win.yml，单配置 x64 / Debug。
name: desktop-win

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PREPARE_PATH: "Telegram/build/prepare/prepare.py"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360

    defaults:
      run:
        shell: cmd

    steps:
      - name: Clone.
        uses: actions/checkout@v4

      - name: Init desktop submodule.
        # 只拉 desktop：android/ios 暂不需要，且 ios 的嵌套子模块源仓库已失效
        shell: bash
        run: |
          git submodule update --init clients/desktop
          git -C clients/desktop submodule update --init --recursive

      - name: Prepare directories.
        # 复刻官方布局：TBuild\Libraries 与客户端仓库互为兄弟目录
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          mklink /d %userprofile%\TBuild\desktop %GITHUB_WORKSPACE%\clients\desktop
          rem prepare 脚本按仓库真实路径解析 ../Libraries，会写到 clients\Libraries
          rem 用符号链接引回 TBuild\Libraries，与缓存路径保持一致
          mklink /d %GITHUB_WORKSPACE%\clients\Libraries %userprofile%\TBuild\Libraries
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Apply chatcraft patches.
        shell: bash
        run: scripts/apply-patches.sh desktop

      - name: Build Rust FFI library.
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          cargo build -p chatcraft-ffi --release
          mkdir -p TBuild/desktop/chatcraft/lib
          cp target/release/chatcraft_ffi.dll TBuild/desktop/chatcraft/
          cp target/release/chatcraft_ffi.dll.lib TBuild/desktop/chatcraft/lib/ || \
          cp target/release/chatcraft_ffi.lib TBuild/desktop/chatcraft/lib/

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/desktop/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/desktop/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "ci@chatcraft.local"
          git config --global user.name "chatcraft-ci"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: 14.44

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Libraries.
        run: |
          %TBUILD%\desktop\Telegram\build\prepare\win.bat skip-release silent

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: Telegram Desktop build.
        # 使用官方测试 api_id/hash，无需配置 secrets；仅供本地测试，不可分发
        run: |
          cd %TBUILD%\desktop\Telegram

          call configure.bat ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=Debug ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config Debug --parallel

      - name: Move artifact.
        run: |
          set OUT=%TBUILD%\desktop\out\Debug
          mkdir artifact
          move %OUT%\Telegram.exe artifact/
          move %OUT%\Updater.exe artifact/

      - uses: actions/upload-artifact@v4
        name: Upload artifact.
        with:
          name: Telegram-Windows-x64
          path: artifact\
          retention-days: 3
