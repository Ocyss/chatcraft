[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi"]
exclude = ["clients", "TBuild"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }

[profile.release]
lto = true
strip = true
